spring.datasource.url=jdbc:h2:mem:booksdb
spring.datasource.username=sa
spring.datasource.password=

# Run every Job bean when the app starts (true is the default).
# Set it to false when the job should run only on demand, e.g. from the REST endpoint.
spring.batch.job.enabled=true

# Spring Batch creates its metadata tables on startup for an embedded database (the default).
spring.batch.jdbc.initialize-schema=embedded

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# The quartz package belongs to a separate example (BatchJobByQuartzApplication, profile "quartz").
spring.autoconfigure.exclude=org.springframework.boot.quartz.autoconfigure.QuartzAutoConfiguration
