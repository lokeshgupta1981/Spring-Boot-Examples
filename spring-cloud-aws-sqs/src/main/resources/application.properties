# LocalStack: docker run -d -p 4566:4566 localstack/localstack:4.12.0
spring.cloud.aws.credentials.access-key=test
spring.cloud.aws.credentials.secret-key=test
spring.cloud.aws.region.static=us-east-1
spring.cloud.aws.sqs.endpoint=http://localhost:4566

# Defaults for every @SqsListener in the app (the annotation can override them)
spring.cloud.aws.sqs.listener.max-concurrent-messages=10
spring.cloud.aws.sqs.listener.max-messages-per-poll=10
spring.cloud.aws.sqs.listener.poll-timeout=10s

# Create a queue that does not exist yet (CREATE is the default; FAIL for production)
spring.cloud.aws.sqs.queue-not-found-strategy=CREATE

app.send-on-startup=true
logging.level.io.awspring.cloud.sqs=WARN
