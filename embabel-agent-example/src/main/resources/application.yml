spring:
  application:
    name: embabel-agent-example
  ai:
    ollama:
      base-url: http://localhost:11434

embabel:
  models:
    default-llm: qwen2.5:7b
  agent:
    platform:
      llm-operations:
        prompts:
          default-timeout: 5m      # default 60s, too short for a CPU-only model
        data-binding:
          max-attempts: 3          # default 10 retries when the JSON doesn't parse
