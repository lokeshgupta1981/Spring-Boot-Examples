spring.application.name=weather-api

# Run every request, @Async method and scheduled task on a virtual thread
spring.threads.virtual.enabled=true

# Kept the same for platform and virtual thread runs (ignored with virtual threads)
server.tomcat.threads.max=200

# RestClient on the JDK HttpClient (WebFlux puts Reactor Netty on the classpath too)
spring.http.clients.imperative.factory=jdk

weather.stub-url=http://localhost:9090
weather.air-quality-limit=50
