spring.application.name=pantry

# API versioning: read the version from the API-Version header
spring.mvc.apiversion.use.header=API-Version
spring.mvc.apiversion.default=1

# HTTP service client group "prices"
spring.http.serviceclient.prices.base-url=http://localhost:8080/supplier
spring.http.serviceclient.prices.connect-timeout=2s
spring.http.serviceclient.prices.read-timeout=3s

# Virtual threads for Tomcat, @Async and the JDK HTTP client
spring.threads.virtual.enabled=true

# OpenTelemetry: sample every request and send traces over OTLP
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.otlp.metrics.export.enabled=false
