spring.application.name=springdoc-openapi

# OpenAPI JSON (default /v3/api-docs) and Swagger UI (default /swagger-ui.html)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Response media type when a handler has no produces attribute (default */*)
springdoc.default-produces-media-type=application/json

# Swagger UI look and feel
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.disable-swagger-default-url=true
# Group shown first in the Select a definition box
springdoc.swagger-ui.urls-primary-name=recipes

# Pretty-print the JSON at /v3/api-docs
springdoc.writer-with-default-pretty-printer=true
