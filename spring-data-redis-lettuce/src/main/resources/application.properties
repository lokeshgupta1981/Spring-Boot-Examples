# Where the Redis server runs (defaults are localhost:6379, database 0)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
#spring.data.redis.username=user
#spring.data.redis.password=secret

# Fail fast instead of hanging when Redis is slow or down
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

# Which client to use: lettuce (default) or jedis
spring.data.redis.client-type=lettuce

# Connection pool (needs commons-pool2 on the classpath)
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=2s

# Same settings for Jedis, used only when client-type=jedis
spring.data.redis.jedis.pool.max-active=16
spring.data.redis.jedis.pool.max-idle=8
spring.data.redis.jedis.pool.min-idle=2
spring.data.redis.jedis.pool.max-wait=2s
