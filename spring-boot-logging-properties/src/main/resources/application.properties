spring.application.name=playlist

# Log levels: WARN and above for libraries, DEBUG and above for our code
logging.level.root=warn
logging.level.com.howtodoinjava=debug

# Also write the log to a file, rolled over at 10MB, kept for 7 days
logging.file.name=logs/playlist.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB

# Log group: one name for several packages
logging.group.music=com.howtodoinjava.logging.playlist,com.howtodoinjava.logging.player

# Change levels at runtime with POST /actuator/loggers/{name}
management.endpoints.web.exposure.include=health,loggers
