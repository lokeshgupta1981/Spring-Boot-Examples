spring.application.name=spring-boot-excel-import

# Upload limits: a single file and the whole multipart request
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

spring.datasource.url=jdbc:h2:mem:school
spring.jpa.open-in-view=false

# JDBC batching for saveAll()
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# Logs JDBC statement and batch counts at the end of each session
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.session.metrics=DEBUG
