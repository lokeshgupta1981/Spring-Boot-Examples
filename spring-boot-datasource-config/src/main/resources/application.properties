spring.application.name=datasource-config

# 1. Main (auto-configured) DataSource
spring.datasource.url=jdbc:h2:mem:recipes
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# 2. HikariCP pool settings for the main DataSource
spring.datasource.hikari.pool-name=recipes-pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# 3. Run schema.sql and data.sql on the main DataSource
spring.sql.init.mode=always

# 4. Second DataSource (not auto-configured, bound by AuditDataSourceConfig)
app.datasource.audit.url=jdbc:h2:mem:audit
app.datasource.audit.username=sa
app.datasource.audit.password=
app.datasource.audit.configuration.pool-name=audit-pool
app.datasource.audit.configuration.maximum-pool-size=3
