apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeting-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: greeting-api
  template:
    metadata:
      labels:
        app: greeting-api
    spec:
      containers:
        - name: greeting-api
          image: greeting-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: GREETING_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: greeting-config
                  key: GREETING_MESSAGE
            - name: GREETING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: greeting-secret
                  key: api-key
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/greetings
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: greeting-secret
                  key: db-password
          startupProbe:                 # gives the JVM up to 150 s to start
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:               # ready to receive traffic from the Service?
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
          livenessProbe:                # still alive? if not, restart the container
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
          lifecycle:
            preStop:                    # keep serving while the Service and Ingress drop this pod
              sleep:
                seconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
