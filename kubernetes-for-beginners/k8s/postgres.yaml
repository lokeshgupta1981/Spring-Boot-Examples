apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None                 # headless: DNS name postgres-0.postgres
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18.6
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: greetings
            - name: POSTGRES_USER
              value: greeting
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: greeting-secret
                  key: db-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
