spring.application.name=greeting-api

# Defaults for a local run; Kubernetes overrides them with environment variables
# (GREETING_MESSAGE from the ConfigMap, GREETING_API_KEY and SPRING_DATASOURCE_* from the Secret)
greeting.message=Hello from my laptop
greeting.api-key=local-key

spring.datasource.url=jdbc:postgresql://localhost:5432/greetings
spring.datasource.username=greeting
spring.datasource.password=greeting
spring.sql.init.mode=always

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
