<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{page.add})}">
  <title>Add a song</title>
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<form th:action="@{/songs}" th:object="${song}" method="post">
  <p class="summary" th:if="*{#fields.hasAnyErrors()}" th:text="#{form.errors(*{#fields.errors('*').size()})}">2 errors</p>

  <label for="title" th:text="#{song.title}">Title</label>
  <input type="text" th:field="*{title}" th:errorclass="invalid">
  <span class="error" th:if="*{#fields.hasErrors('title')}" th:errors="*{title}">Title error</span>

  <label for="artist" th:text="#{song.artist}">Artist</label>
  <input type="text" th:field="*{artist}" th:errorclass="invalid">
  <span class="error" th:errors="*{artist}">Artist error</span>

  <label for="durationSeconds" th:text="#{song.seconds}">Length in seconds</label>
  <input type="number" th:field="*{durationSeconds}" th:errorclass="invalid">
  <span class="error" th:errors="*{durationSeconds}">Length error</span>

  <label for="released" th:text="#{song.released}">Released</label>
  <input type="date" th:field="*{released}" th:errorclass="invalid">
  <span class="error" th:errors="*{released}">Date error</span>

  <label for="genre" th:text="#{song.genre}">Genre</label>
  <select th:field="*{genre}">
    <option value="POP">Pop</option>
    <option value="ROCK">Rock</option>
    <option value="JAZZ">Jazz</option>
  </select>

  <button type="submit" th:text="#{form.save}">Save</button>
</form>

<footer th:insert="~{fragments/layout :: copy}"></footer>
</body>
</html>
